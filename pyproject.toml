[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "SincedPy"
version = "0.1.0"
description = "CLI clean todo app"
requires-python = ">=3.12"
dependencies = [
  "tinydb",
  "python-dateutil",
]

[project.scripts]
scd = "SincedPy.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/SincedPy"]
